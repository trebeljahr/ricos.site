# Build → upload → activate pipeline for ricos.site on Cloudflare Workers.
# The site is a static export served by the assets-only Worker
# `ricos-site-client` (wrangler.jsonc); the few routes that need code run in
# the API Worker `ricos-site-api` (workers/api). No server, no image.
# See docs/static-site.md.
#
#   1. build  — check out the private Notes repo (the content), run the full
#               `pnpm build` (export, link and alt checks, _redirects,
#               _headers, version.json), carry the hashed chunks of the two
#               releases before this one, bundle the API Worker's data, and
#               upload a version of both Workers. An upload is not live.
#   images — in parallel: write R2 variants for images added since the last
#            run (src/scripts/aws/syncR2Variants.mjs).
#   2. deploy — activate the API version, then the site version, verify that
#               ricos.site serves this run's commit and Notes commit, record a
#               GitHub Deployment.
#
# Notes is checked out at its `main`, not at the submodule pin. A push to
# Notes `main` starts this workflow through workflow_dispatch (the Notes
# repo's .github/workflows/main.yaml, token secret RICOS_SITE_DEPLOY_TOKEN
# there), so a vault-only change deploys without a ricos.site commit. Such a
# run rebuilds the same ricos.site sha; /version.json's `notes` field tells
# the two builds apart.
#
# Repo secrets:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID — Workers Scripts: Edit on the
#                                   account; no route or DNS permission. Without
#                                   them the build still runs and nothing is
#                                   uploaded.
#   DOTENV_PRIVATE_KEY_PRODUCTION — decrypts .env.production for the build
#                                   (NEXT_PUBLIC_* values, offered lists) and
#                                   for the images job.
#   NOTES_DEPLOY_KEY              — read-only deploy key of trebeljahr/Notes.
# The API Worker's own secrets (ListMonk, token secret, emergency) live on
# the Worker, set once with `wrangler secret put` (workers/api/wrangler.jsonc).
name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  WRANGLER_SEND_METRICS: "false"
  SITE: https://ricos.site

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      notes_sha: ${{ steps.notes.outputs.sha }}
      client_version: ${{ steps.upload.outputs.client_version }}
      api_version: ${{ steps.upload.outputs.api_version }}
    steps:
      - uses: actions/checkout@v7
      - name: Check out the Notes content
        uses: actions/checkout@v7
        with:
          repository: trebeljahr/Notes
          ref: main
          path: src/content/Notes
          ssh-key: ${{ secrets.NOTES_DEPLOY_KEY }}
          persist-credentials: false
      - name: Read the Notes commit
        id: notes
        run: echo "sha=$(git -C src/content/Notes rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # Private writing that only `next dev` reads. The export never touches
      # it; removing it keeps it out of every step below.
      - name: Drop Notes/texts
        run: rm -rf src/content/Notes/texts

      # The version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: "0"

      - name: Build the static export
        env:
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
          # Written to out/version.json by src/scripts/static/finishExport.ts.
          COMMIT_SHA: ${{ github.sha }}
          NOTES_SHA: ${{ steps.notes.outputs.sha }}
          # One id per build. Next compares it on every client navigation, so
          # a tab still running the previous deploy does a full reload
          # instead of mixing builds. A Notes-only push rebuilds the same
          # site commit with new content, so the Notes commit is part of it.
          NEXT_DEPLOYMENT_ID: ${{ github.sha }}-${{ steps.notes.outputs.sha }}
          NEXT_TELEMETRY_DISABLED: "1"
          # The site build peaks well above Node's default heap.
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -euo pipefail
          test -n "$DOTENV_PRIVATE_KEY_PRODUCTION" || {
            echo "::error::DOTENV_PRIVATE_KEY_PRODUCTION is not set."; exit 1; }
          pnpm dlx @dotenvx/dotenvx@1.64.0 run -f .env.production -- pnpm build

      - name: Check the API Worker
        run: |
          pnpm api:typecheck
          pnpm exec vitest run workers

      # A Worker version serves only its own files. Tabs opened before this
      # release still ask for the hashed chunks of the releases before it.
      - name: Carry the hashed files of the two releases before this one
        env:
          NOTES_SHA: ${{ steps.notes.outputs.sha }}
        run: >-
          node src/scripts/static/carry-static.mjs --site "$SITE" --out out
          --release "${GITHUB_SHA}-${NOTES_SHA:0:12}"

      - name: Upload a version of both Workers (not live yet)
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NOTES_SHA: ${{ steps.notes.outputs.sha }}
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          set -euo pipefail
          upload() { # config, output name
            local log="$RUNNER_TEMP/wrangler-$2.ndjson" id
            WRANGLER_OUTPUT_FILE_PATH="$log" pnpm exec wrangler versions upload \
              --config "$1" --tag "$GITHUB_SHA" --message "Commit $GITHUB_SHA, Notes $NOTES_SHA"
            id=$(node -e '
              const lines = require("fs").readFileSync(process.argv[1], "utf8").split("\n").filter(Boolean);
              const upload = lines.map((l) => JSON.parse(l)).find((e) => e.type === "version-upload");
              if (!/^[0-9a-f-]{36}$/.test(upload?.version_id ?? "")) process.exit(1);
              console.log(upload.version_id);
            ' "$log")
            echo "$2=$id" >> "$GITHUB_OUTPUT"
            echo "Uploaded $1 as version $id (not live)." >> "$GITHUB_STEP_SUMMARY"
          }
          upload workers/api/wrangler.jsonc api_version
          upload wrangler.jsonc client_version

  # R2 has no on-demand variants the way CloudFront's Lambda did: write the
  # ones new images are missing before the build that references them goes
  # live. Usually there are none, and this only lists the two buckets.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            src/scripts/aws/syncR2Variants.mjs
            .env.production
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Write missing image variants to R2
        env:
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2sync
          cp src/scripts/aws/syncR2Variants.mjs .env.production /tmp/r2sync/
          cd /tmp/r2sync
          npm install --no-audit --no-fund --no-save @aws-sdk/client-s3@3 sharp@0.35.5 @dotenvx/dotenvx@1.64.0
          npx dotenvx run -q -f .env.production -- node syncR2Variants.mjs

  # Runs when the build uploaded both versions. The API goes first: the new
  # pages may call it, the old pages work with either API version.
  deploy:
    runs-on: ubuntu-latest
    needs: [build, images]
    if: needs.build.outputs.client_version != '' && needs.build.outputs.api_version != ''
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NOTES_SHA: ${{ needs.build.outputs.notes_sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: "0"

      - name: Activate the API version, then the site version
        env:
          API_VERSION: ${{ needs.build.outputs.api_version }}
          CLIENT_VERSION: ${{ needs.build.outputs.client_version }}
        run: |
          set -euo pipefail
          message="Release $GITHUB_SHA, Notes $NOTES_SHA"
          pnpm exec wrangler versions deploy "$API_VERSION@100%" \
            --config workers/api/wrangler.jsonc --yes --message "$message"
          pnpm exec wrangler versions deploy "$CLIENT_VERSION@100%" \
            --config wrangler.jsonc --yes --message "$message"
          {
            echo "Activated ricos-site-api $API_VERSION and ricos-site-client $CLIENT_VERSION."
            echo "Rollback: \`wrangler versions deploy <older id>@100%\` with the same config."
          } >> "$GITHUB_STEP_SUMMARY"

      # The activation only proves Cloudflare accepted it. This proves the
      # public host serves this run's commit and Notes commit, and that the
      # API Worker answers on its route. Polls with a cache-busting query:
      # the point is what the Worker serves, not a cached copy.
      - name: Verify ricos.site serves this release
        run: |
          set -uo pipefail
          got=""
          for i in $(seq 1 40); do
            got=$(curl -fsSL --max-time 10 "$SITE/version.json?release_cb=$i$RANDOM" 2>/dev/null \
                    | jq -r '"\(.commit) \(.notes)"' 2>/dev/null || true)
            if [ "$got" = "$GITHUB_SHA $NOTES_SHA" ]; then
              echo "✓ $SITE serves $GITHUB_SHA with Notes $NOTES_SHA"; break
            fi
            echo "  version.json: ${got:-<no response>} — waiting ($i/40)"
            sleep 15
          done
          if [ "$got" != "$GITHUB_SHA $NOTES_SHA" ]; then
            echo "::error::$SITE never reported $GITHUB_SHA $NOTES_SHA (last seen: ${got:-<no response>})."
            exit 1
          fi
          quote=$(curl -fsS --max-time 10 "$SITE/api/quote" | jq -r '.content // empty' || true)
          if [ -z "$quote" ]; then
            echo "::error::$SITE/api/quote did not answer with a quote: the API Worker route is broken."
            exit 1
          fi
          echo "✓ $SITE/api/quote answers"

      # Leave a GitHub Deployment for this commit on the `web` channel, so
      # HQ's Shipped view and the Environments page show what is live.
      - name: Record the web deploy
        uses: ./.github/actions/record-ship
        with:
          environment: web
          url: ${{ env.SITE }}
